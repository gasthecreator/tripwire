name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: fmt, clippy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

  test:
    name: cargo test (real anvil, not mocks)
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The chain-adapter and guardian-client integration tests spawn a
      # real local anvil node rather than mocking chain I/O (this
      # project's standing preference for validating against real
      # infrastructure) -- see crates/chain-adapter/tests/evm_anvil.rs
      # and crates/guardian-client/tests/guardian_anvil.rs.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # guardian-client's end-to-end test deploys the *actual* compiled
      # Guardian/GuardedVault bytecode, so contracts must be built first.
      - name: forge install && forge build
        working-directory: contracts
        run: |
          forge install
          forge build

      - name: cargo test --workspace
        run: cargo test --workspace --all-features
