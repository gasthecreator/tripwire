name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: fmt, clippy, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # guardian-client's `sol!` macro invocations read the compiled
      # contract JSON artifacts (contracts/out/*.json) at *compile time*
      # to generate bindings -- this isn't just a test-runtime need, so
      # even `cargo clippy`/`cargo build --all-targets` (which compile
      # test binaries) require contracts/ built first.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: forge install && forge build
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.16.2 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.7.0 --no-git
          forge build

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

  test:
    name: cargo test (real anvil, not mocks)
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The chain-adapter and guardian-client integration tests spawn a
      # real local anvil node rather than mocking chain I/O (this
      # project's standing preference for validating against real
      # infrastructure) -- see crates/chain-adapter/tests/evm_anvil.rs
      # and crates/guardian-client/tests/guardian_anvil.rs.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # guardian-client's end-to-end test deploys the *actual* compiled
      # Guardian/GuardedVault bytecode, so contracts must be built first.
      - name: forge install && forge build
        working-directory: contracts
        run: |
          forge install foundry-rs/forge-std@v1.16.2 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.7.0 --no-git
          forge build

      - name: cargo test --workspace
        run: cargo test --workspace --all-features

  replay:
    name: replay-harness (real historical exploit, needs ETH_RPC_URL secret)
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: ${{ vars.RUN_REPLAY_TESTS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fetches the real Beanstalk exploit transaction (block 14602790)
      # from a real archive RPC and scores its actual decoded call trace
      # through the real detection engine -- see
      # crates/replay-harness/tests/beanstalk_governance_exploit.rs.
      - name: cargo test -p replay-harness
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        run: cargo test -p replay-harness
