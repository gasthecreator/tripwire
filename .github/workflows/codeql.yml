name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Rust)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: github/codeql-action/init@v3
        with:
          languages: rust

      - name: Build (required for CodeQL's Rust analysis)
        run: cargo build --workspace

      - uses: github/codeql-action/analyze@v3
