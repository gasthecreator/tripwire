[package]
name = "tripwire-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tripwire_daemon"
path = "src/lib.rs"

[[bin]]
name = "tripwire-daemon"
path = "src/main.rs"

[dependencies]
tripwire-core.workspace = true
chain-adapter.workspace = true
detection.workspace = true
guardian-client.workspace = true
tripwire-context.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait = "0.1"
thiserror.workspace = true
alloy = { version = "1", features = ["full"] }
reqwest = "0.13"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "process"] }
serde_json.workspace = true
