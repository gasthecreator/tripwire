# Classic single-function reentrancy: an external call is made before a
# state update, letting the callee re-enter the same function and repeat
# the withdrawal before the first call's balance decrement lands.
# Historical precedent: The DAO (2016), dForce (Feb 2020).
id: reentrancy-basic
description: >
  A state-changing call to a (target, function-selector) pair is made
  while an earlier call to that same pair is still active on the call
  stack (a true re-entry, not a repeat after the first call returned, and
  not a read-only STATICCALL), paired with a real fund outflow. Nested
  callbacks are also used legitimately (chained flash swaps re-enter
  uniswapV2Call), which is why the re-entry alone is deliberately below a
  typical pause threshold and the outflow corroboration is required.
category: reentrancy
window_seconds: 5
conditions:
  - id: reenters-same-function
    kind:
      type: reentrancy_depth
      min_depth_delta: 1
    weight: 65.0
  - id: outflow-during-reentry
    kind:
      type: fund_flow_delta
      threshold_pct: 5.0
    weight: 30.0
