[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test/unit"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.26"
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Historical-exploit replay tests (`test/replay/`) fork real mainnet at a
# specific past block and hit a real archive RPC — they're excluded from
# the default `forge test` run (see `test` above) so a plain local run
# never silently depends on network access or an API key. Run them
# explicitly with `FOUNDRY_PROFILE=replay forge test`, after setting
# `ETH_RPC_URL` (see `.env.example`).
[profile.replay]
src = "src"
out = "out"
libs = ["lib"]
test = "test/replay"

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
