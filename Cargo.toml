[workspace]
resolver = "2"
members = [
    "crates/tripwire-core",
    "crates/chain-adapter",
    "crates/detection",
    "crates/guardian-client",
    "crates/tripwire-daemon",
    "crates/replay-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gasthecreator/tripwire"

[workspace.dependencies]
tripwire-core = { path = "crates/tripwire-core" }
chain-adapter = { path = "crates/chain-adapter" }
detection = { path = "crates/detection" }
guardian-client = { path = "crates/guardian-client" }

serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = true
